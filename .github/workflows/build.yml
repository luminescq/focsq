#
# Сборка FOCSQ на GitHub Actions.
#
#   windows: ядро (cargo check + тесты) + flutter build windows → zip-артефакт
#   linux:   ядро (первая реальная компиляция tun_linux.rs — netlink/ioctl
#            писались вслепую с Windows-машины) + analyze/test фронтенда
#            + flutter build linux → tar-артефакт
#   android: клиент (cargo-ndk, 3 ABI → jniLibs/libclient.so) + сервер
#            (cargo-zigbuild, 3 Linux-варианта → assets) + gradle APK
#
# Пины версий повторяют среду разработки:
#   Rust           1.97.1  (rust-version из Cargo.toml)
#   Flutter        3.44.9  (локальная stable-установка, Dart 3.12.2)
#   Zig            0.17.0, cargo-ndk 4.1.2, cargo-zigbuild 0.23.4
#   Android:       JDK 17, platform 37 (пакет platforms;android-37.0),
#                  build-tools 36.0.0, NDK 28.2.13676358
#   Подпись APK:   секреты KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS /
#                  KEY_PASSWORD — без них release-APK собирается без подписи
#
# Linux-платформа Flutter (frontend/linux) сгенерирована и лежит в
# репозитории, как windows/: бинарник «focsq», окно «FOCSQ».

name: build

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 — ядро + GUI
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.97.1
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-windows-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Ядро — компиляция
        working-directory: backend
        run: cargo check --all-targets --locked

      - name: Ядро — тесты
        working-directory: backend
        run: cargo test --lib --locked

      - name: Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Зависимости фронтенда
        working-directory: frontend
        run: flutter pub get

      # cargokit (rust_builder) сам собирает cdylib ядра (cargo build --release)
      - name: Сборка GUI (release)
        working-directory: frontend
        run: flutter build windows --release

      # flutter build не кладёт VC++ Runtime рядом с exe (динамический CRT),
      # а приложение без него не запустится на чистой Windows. Копируем из
      # System32 раннера (VC++ 2022 Runtime предустановлен) — то же самое
      # делает copy_redist_dlls в локальном make-инструменте. Шаг стоит до
      # zip и установщика, чтобы и портативный архив, и Setup.exe содержали
      # DLL. wintun.dll не трогаем: приложение распаковывает её само из
      # ассетов в %LOCALAPPDATA%\FOCSQ.
      - name: VC++ Runtime в Release
        run: |
          release='frontend/build/windows/x64/runner/Release'
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll; do
            cp "/c/Windows/System32/$dll" "$release/"
            echo "  + $dll"
          done

      - name: ZIP-артефакт
        shell: pwsh
        run: |
          $release = 'frontend/build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/focsq.exe")) { throw 'focsq.exe не найден в Release' }
          Compress-Archive -Path "$release/*" -DestinationPath focsq-windows-x64.zip -Force
          Get-Item focsq-windows-x64.zip | Format-List Name,Length

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: focsq-windows-x64
          path: focsq-windows-x64.zip
          if-no-files-found: error

      # Inno Setup 6 предустановлен на образе. Версия установщика — из
      # pubspec (1.2.3+4 → 1.2.3), iss принимает её через -DAppVersion
      # (дефис, а не слэш: bash-раннер — это Git Bash, MSYS конвертирует
      # /D-опции в пути). wintun.dll в Release не кладём — приложение
      # распаковывает её из ассетов само.
      - name: Установщик (Inno Setup)
        working-directory: frontend
        run: |
          VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | cut -d'+' -f1)
          ISCC=''
          for p in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
                   "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            [ -f "$p" ] && ISCC="$p" && break
          done
          [ -z "$ISCC" ] && ISCC=ISCC.exe
          echo "ISCC: $ISCC, AppVersion: $VERSION"
          "$ISCC" "-DAppVersion=$VERSION" tools/focsq_setup.iss
          test -f build/FOCSQ-Setup.exe
          ls -lh build/FOCSQ-Setup.exe

      - name: Публикация установщика
        uses: actions/upload-artifact@v4
        with:
          name: focsq-windows-setup
          path: frontend/build/FOCSQ-Setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64 — ядро + GUI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # GTK — Flutter-desktop; webkit2gtk — desktop_webview_window (VK-логин);
      # libsecret — flutter_secure_storage; ayatana-appindicator — tray_manager.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev

      - name: Rust 1.97.1
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-linux-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-linux-

      # Падение этого шага и есть результат проверки вслепую написанного
      # netlink/ioctl-кода из tun_linux.rs — на Windows-машине он не
      # компилировался никогда.
      - name: Ядро — компиляция
        working-directory: backend
        run: cargo check --all-targets --locked

      - name: Ядро — тесты
        working-directory: backend
        run: cargo test --lib --locked

      - name: Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Зависимости фронтенда
        working-directory: frontend
        run: flutter pub get

      - name: Анализатор
        working-directory: frontend
        # --no-fatal-infos: в коде есть 3 старых info-замечания
        # (имена файлов в lib/modals, print в check_enc.dart);
        # ошибки и предупреждения остаются фатальными
        run: flutter analyze --no-fatal-infos

      - name: Тесты фронтенда
        working-directory: frontend
        run: flutter test

      - name: Сборка GUI (release)
        working-directory: frontend
        run: flutter build linux --release

      # tar, а не zip: exec-бит бинарника должен сохраниться при распаковке
      - name: tar-артефакт
        run: |
          tar -czf focsq-linux-x64.tar.gz -C frontend/build/linux/x64/release/bundle .
          ls -lh focsq-linux-x64.tar.gz

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: focsq-linux-x64
          path: focsq-linux-x64.tar.gz
          if-no-files-found: error

  # Android-сборка на windows-раннере: SDK предустановлен в образе, а
  # provenance-скрипты (.ps1) используют Windows-пути. Шаги повторяют
  # локальные mobile/rust-client/build_so.bat и mobile/rust-server/
  # build_linux.bat (без интерактивных пауз и MSVC-части — она нужна
  # только для десктопных тестов клиента).
  android:
    name: Android APK — клиент + сервер + приложение
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust 1.97.1 + цели
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-mobile-${{ hashFiles('mobile/rust-client/Cargo.lock', 'mobile/rust-server/Cargo.lock') }}
          restore-keys: cargo-mobile-

      - name: cargo-ndk 4.1.2 и cargo-zigbuild 0.23.4
        run: |
          command -v cargo-ndk || cargo install cargo-ndk@4.1.2 --locked
          command -v cargo-zigbuild || cargo install cargo-zigbuild@0.23.4 --locked

      - name: Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Android SDK — platform 37, build-tools, NDK 28.2
        run: |
          ANDROID_HOME="/c/Android/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          if [ ! -f "$SDKMANAGER" ]; then
            curl -fsSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=C:\\Android\\android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=C:\\Android\\android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=C:\\Android\\android-sdk\\ndk\\28.2.13676358" >> "$GITHUB_ENV"

      - name: Кэш Android SDK
        uses: actions/cache@v4
        with:
          path: |
            C:\Android\android-sdk\ndk\28.2.13676358
            C:\Android\android-sdk\platforms\android-37.0
            C:\Android\android-sdk\build-tools\36.0.0
          key: android-sdk-ndk28.2.13676358-p37.0-bt36

      - name: Клиент — libclient.so (3 ABI)
        working-directory: mobile/rust-client
        run: |
          cargo ndk -t arm64-v8a -P 26 build --release \
            --target-dir ../build/rust-client-android-arm64
          cargo ndk -t armeabi-v7a -P 26 build --release \
            --target-dir ../build/rust-client-android-armv7
          cargo ndk -t x86_64 -P 26 build --release \
            --target-dir ../build/rust-client-android-x86_64
          mkdir -p ../app/src/main/jniLibs/arm64-v8a \
                   ../app/src/main/jniLibs/armeabi-v7a \
                   ../app/src/main/jniLibs/x86_64
          cp ../build/rust-client-android-arm64/aarch64-linux-android/release/client \
             ../app/src/main/jniLibs/arm64-v8a/libclient.so
          cp ../build/rust-client-android-armv7/armv7-linux-androideabi/release/client \
             ../app/src/main/jniLibs/armeabi-v7a/libclient.so
          cp ../build/rust-client-android-x86_64/x86_64-linux-android/release/client \
             ../app/src/main/jniLibs/x86_64/libclient.so
          ls -lh ../app/src/main/jniLibs/*/libclient.so

      - name: Сервер — 3 Linux-варианта в ассеты
        working-directory: mobile/rust-server
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl \
            --target-dir ../build/csqtt-uring-linux-amd64
          cargo zigbuild --release --target aarch64-unknown-linux-musl \
            --target-dir ../build/csqtt-uring-linux-arm64
          cargo zigbuild --release --target armv7-unknown-linux-musleabihf \
            --target-dir ../build/csqtt-uring-linux-armv7
          mkdir -p ../app/src/main/assets
          cp ../build/csqtt-uring-linux-amd64/x86_64-unknown-linux-musl/release/csqtt \
             ../app/src/main/assets/csqtt-linux-amd64
          cp ../build/csqtt-uring-linux-arm64/aarch64-unknown-linux-musl/release/csqtt \
             ../app/src/main/assets/csqtt-linux-arm64
          cp ../build/csqtt-uring-linux-armv7/armv7-unknown-linux-musleabihf/release/csqtt \
             ../app/src/main/assets/csqtt-linux-armv7
          ls -lh ../app/src/main/assets/csqtt-linux-*

      - name: Provenance нативных бинарников
        # bash + set -e: PowerShell-скрипты падают с непустым кодом, и шаг
        # не должен молча проглатывать это (раньше падение client-write
        # маскировалось успехом последней команды).
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File mobile/scripts/native_client_provenance.ps1 -Mode Write
          pwsh -NoProfile -File mobile/scripts/native_client_provenance.ps1 -Mode Verify
          pwsh -NoProfile -File mobile/scripts/server_asset_provenance.ps1 -Mode Write
          pwsh -NoProfile -File mobile/scripts/server_asset_provenance.ps1 -Mode Verify

      # Без секретов release-APK собирается без подписи (установить на
      # телефон можно debug-сборку). Значения секретов в лог не попадают:
      # GitHub маскирует зарегистрированные секреты в GITHUB_ENV.
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mobile/release.keystore
            {
              echo "KEYSTORE_FILE=./release.keystore"
              echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${KEY_ALIAS}"
              echo "KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Секреты подписи не заданы — release-APK будет без подписи"
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: APK (release + debug)
        working-directory: mobile
        # mobile/gradle.properties просит -Xmx8G — больше, чем есть у
        # GitHub-раннера (7 ГБ), демон был бы убит OOM-киллером. Heap
        # ограничиваем через -D (приоритетнее gradle.properties), Kotlin —
        # в процессе сборки, release и debug — по очереди.
        run: |
          JVMARGS="-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          ./gradlew.bat :app:assembleRelease --no-daemon --stacktrace --max-workers=2 \
            "$JVMARGS" -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew.bat :app:assembleDebug --no-daemon --stacktrace --max-workers=2 \
            "$JVMARGS" -Pkotlin.compiler.execution.strategy=in-process

      - name: Публикация APK
        uses: actions/upload-artifact@v4
        with:
          name: focsq-android
          path: |
            mobile/app/build/outputs/apk/release/*.apk
            mobile/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error

  # Тег v* → Release на GitHub с вложениями-сборками. Приложение
  # проверяет /releases/latest (UpdateService) — Draft/pre-release
  # игнорируются API.
  release:
    name: Release на GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история — для списка коммитов с прошлого тега
          fetch-depth: 0

      - name: Скачивание сборок
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Примечания к релизу (коммиты с прошлого тега)
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}$GITHUB_REF_NAME"
          {
            if [ -n "$PREV_TAG" ]; then
              echo "Изменения с $PREV_TAG:"
            else
              echo "Первый релиз."
            fi
            git log --format='- %s (%h)' "$RANGE" 2>/dev/null | head -60 || true
            echo
            echo '## Установка'
            echo '- **Windows**: `FOCSQ-Setup.exe` — установщик (Inno Setup). Альтернатива без установки: распаковать `focsq-windows-x64.zip`, запустить `focsq.exe`.'
            echo '- **Linux**: распаковать `focsq-linux-x64.tar.gz`, запустить `focsq.sh` (он сам поставит зависимости, выдаст cap_net_admin через focsq-tun и запустит приложение).'
            echo '- **Android**: `focsq-android` содержит universal-APK и ABI-варианты; release-APK подписан только при наличии секретов подписи, иначе используйте debug-сборку (`-forktest`).'
          } > notes.md

      # gh на ubuntu-runner предустановлен и аутентифицирован через
      # GITHUB_TOKEN (permissions: contents: write выше).
      - name: Создание Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist/
          # Пересборка релиза: старый v1.0.0 (без Setup.exe и с багом 740)
          # удаляем целиком и создаём заново на свежих артефактах.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --title "FOCSQ $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/focsq-windows-x64.zip \
            dist/focsq-linux-x64.tar.gz \
            dist/FOCSQ-Setup.exe \
            dist/*.apk

  # Бета-публикация: на каждый push в beta/workflow_dispatch артефакты
  # заливаются в релиз с тегом dist (--clobber обновляет файлы на месте).
  dist:
    name: Публикация в dist
    if: github.ref == 'refs/heads/beta' || github.event_name == 'workflow_dispatch'
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Скачивание сборок
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Обновление релиза dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist/
          gh release view dist --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dist --repo "$GITHUB_REPOSITORY" \
              --title "Beta builds" \
              --notes "Автоматические бета-сборки. Обновляется при каждом push в beta."
          gh release upload dist --repo "$GITHUB_REPOSITORY" --clobber \
            dist/focsq-windows-x64.zip \
            dist/focsq-linux-x64.tar.gz \
            dist/FOCSQ-Setup.exe \
            dist/*.apk
